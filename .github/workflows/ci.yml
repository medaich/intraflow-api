name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3001
      APP_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:5173
      TRUST_PROXY: 1
      COOKIE_SECURE: "false"
      COOKIE_KEY: super_secret_cookie_signing_key_at_least_32_chars_long
      TOKEN_EXPIRATION: 86400
      MYSQL_HOST: localhost
      MYSQL_PORT: 3308
      MYSQL_DATABASE: intraflow_test
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: secret
      ADMIN_EMAIL: admin@intraflow.dev
      ADMIN_PASSWORD: AdminPassword123!
      ADMIN_NAME: Super Admin
      MAIL_TRANSPORT: memory
      MAIL_FROM: Intraflow Test <noreply@intraflow.dev>
      RESET_TOKEN_TTL: 3600
      EMAIL_CHANGE_TOKEN_TTL: 3600
      STORAGE_DIR: ./test-storage
      MAX_FILE_SIZE: 10485760
      MAX_ATTACHMENTS_PER_TASK: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: intraflow_test
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -psecret" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Build Application
        run: pnpm build

      - name: Check Test Traceability Matrix
        run: pnpm run check:traceability

      - name: Run Unit Tests with Coverage
        run: pnpm test:cov

      - name: Run Migrations against Test Database
        run: pnpm run migration:run

      - name: Run E2E Tests
        run: pnpm test:e2e

      - name: Upload Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t intraflow-api:test .
